name: Deploy New Version

on:
  repository_dispatch:
    types: [rollingversions_publish_approved]

permissions:
  contents: write
  id-token: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
    - name: Install npm with trusted publishing support
      run: npm install --global npm@11
    - name: Install dependencies and build
      run: |
        node --version
        npm --version
        npm ci
        npm run build --if-present
      env:
        CI: true
        NODE_OPTIONS: --openssl-legacy-provider
    - name: Publish approved release with npm trusted publishing
      run: |
        test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
        test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
        npx --yes rollingversions@3.5.0 publish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Copy dist to docs/examples/dist
      run: |
        npx cpx "dist/*" "docs/examples/dist"
    - name: Commit and push updated examples
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -f docs/examples/dist/*
        git commit -m "Update docs/examples/dist with latest build" || echo "No changes to commit"
        git push
